name: CI

# Actions minutes are limited on a private repository, and each job is billed
# rounded up to the whole minute: one run costs about 3. So it runs only for
# pushes that change code (notes such as CLAUDE.md alone run nothing), and by
# hand (Actions → CI → Run workflow). Pull requests aren't used here (work
# goes straight to main), so they run nothing either.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# A newer push supersedes a run still in progress (its deploy would be replaced anyway).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks, then the build published to GitHub Pages: one job, as a
  # separate ten-second deploy job was billed a minute of its own.
  check:
    runs-on: ubuntu-latest
    # A run takes a few minutes: a hang fails here rather than holding the queue for hours.
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Commit emails are public along with the repository: only noreply
      # addresses belong here (see CLAUDE.md). This names the commits, never the address.
      - name: Commit emails are noreply addresses
        run: |
          bad=$(jq -r '[.head_commit // empty, (.commits // [])[]] | unique_by(.id)[]
            | select([.author.email, .committer.email] | any((. // "") | test("no-?reply"; "i") | not))
            | .id[0:7]' "$GITHUB_EVENT_PATH")
          if [ -n "$bad" ]; then
            echo "::error::These commits carry an email that isn't a noreply address:" $bad
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:engine
      # The engine must stay free of Node APIs so it runs in Cloudflare Workers.
      - run: "! grep -rl \"node:\" packages/engine/dist/"
      - run: npm run -s fuzz -- 3 64 3
      # The engine API reference is generated from the doc comments: keep it current.
      - run: npm run -s docs && git diff --exit-code packages/engine/docs
      # Every commit on main that passes the checks is published to GitHub Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
